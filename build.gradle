plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0'
group = 'com.steve.ai'

base {
    archivesName = 'aisteve'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Source files are UTF-8 (they contain Chinese comments and strings). Without this the
// compiler falls back to the platform default encoding - GBK on a Chinese Windows JVM -
// and fails with "unmappable character" errors on dozens of unrelated files, which looks
// like broken code but is purely a locale problem.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                aisteve {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                aisteve {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'

    // HTTP client - Using Java 11+ built-in HttpClient (no external dependencies needed!)
    // JSON parsing - Minecraft already includes Gson

    // GraalVM for JavaScript code execution engine
    implementation 'org.graalvm.polyglot:polyglot:23.1.0'
    implementation 'org.graalvm.polyglot:js:23.1.0'

    // Resilience4j for fault tolerance (circuit breaker, retry, rate limiting, bulkhead)
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.1.0'
    implementation 'io.github.resilience4j:resilience4j-retry:2.1.0'
    implementation 'io.github.resilience4j:resilience4j-ratelimiter:2.1.0'
    implementation 'io.github.resilience4j:resilience4j-bulkhead:2.1.0'

    // Caffeine cache for LLM response caching
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    // Apache Commons for SHA-256 hashing (cache keys)
    implementation 'commons-codec:commons-codec:1.16.0'

    // JUnit 5 for testing
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.3'
}

test {
    useJUnitPlatform()
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title': 'AiSteve',
            'Specification-Vendor': 'AiSteve',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': 'AiSteve'
        ])
    }

    finalizedBy 'reobfJar'
}

// ---------------------------------------------------------------------------
// Distributable "fat" jar.
//
// The default `jar` / `reobfJar` output only contains the mod's own classes.
// The mod's runtime dependencies (resilience4j, caffeine)
// are NOT bundled, so installing that plain jar into Minecraft fails at runtime
// with NoClassDefFoundError as soon as a Steve is asked to plan a task.
//
// `fatJar` merges the reobfuscated mod classes with those libraries into a
// single installable jar (aisteve-<version>-all.jar).
//
// Notes:
//  - GraalVM (org.graalvm.polyglot) is intentionally NOT bundled: CodeExecutionEngine
//    is never instantiated in this codebase, and bundling the JS engine is large and
//    conflicts with other mods that ship GraalVM.
//  - Minecraft/Forge jars are never bundled.
// ---------------------------------------------------------------------------
// Libraries that are ALREADY provided by Minecraft / Forge must NOT be bundled:
//  - commons-codec: shipped with Forge (1.20.1 -> 1.15). Bundling it causes
//      java.lang.module.ResolutionException: Modules steve and org.apache.commons.codec
//      export package org.apache.commons.codec.language to module minecraft
//    and the game crashes on startup. The mod uses Forge's copy at runtime.
// Only bundle libraries that Forge does NOT provide.
def bundledLibPrefixes = ['resilience4j-', 'caffeine-']

tasks.register('fatJar', Jar) {
    group = 'build'
    description = 'Builds an installable mod jar with the required runtime libraries bundled.'

    // reobfJar rewrites build/libs/aisteve-<version>.jar in place, so the
    // packing must happen after reobfuscation.
    dependsOn tasks.named('reobfJar')

    archiveClassifier.set('all')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes([
            'Specification-Title': 'AiSteve',
            'Specification-Vendor': 'AiSteve',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'AiSteve'
        ])
    }

    // 1) Reobfuscated mod classes + resources
    from({ zipTree(tasks.named('jar').get().archiveFile.get().asFile) })

    // 2) Bundled runtime libraries
    from({
        configurations.runtimeClasspath.findAll { f ->
            f.name.endsWith('.jar') && bundledLibPrefixes.any { prefix -> f.name.startsWith(prefix) }
        }.collect { zipTree(it) }
    }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude '**/module-info.class'
        // Defensive: never ship packages that Minecraft/Forge already provide,
        // otherwise the JPMS module layer fails with ResolutionException.
        exclude 'org/apache/commons/codec/**'
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('fatJar')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

